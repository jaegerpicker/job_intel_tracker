name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy job_intel_tracker
      - run: node --check job_intel_tracker/static/app.js
      - run: python -m build
      - run: docker build -t job-intel-tracker:ci .
